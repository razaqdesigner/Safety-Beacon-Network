kind = "mobile"
previewPath = "/"
title = "SafeAlert"
version = "1.0.0"
id = "artifacts/safe-alert"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25739

[services.development]
run = "pnpm --filter @workspace/safe-alert run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safe-alert", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/safe-alert", "run", "serve" ]

[services.env]
PORT = "25739"
BASE_PATH = "/"
