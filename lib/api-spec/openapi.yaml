openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SafeAlert community safety API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Citizen sessions and account recovery
  - name: admin
    description: Dispatcher sign-in
  - name: users
    description: Registered citizens
  - name: alerts
    description: Emergency distress alerts
  - name: broadcasts
    description: Announcements dispatchers send to every citizen
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a new citizen
      description: >
        Creates a registered user account and returns a device session token.
        Fails with 409 if the email, phone number or National ID is already
        registered — the citizen should recover that account instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserInput"
      responses:
        "200":
          description: Registered user and session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: An account with these details already exists

  /auth/recover:
    post:
      operationId: startRecovery
      tags: [auth]
      summary: Send a one-time code to recover an account
      description: >
        Looks up the account by phone or National ID and sends a 6-digit code
        to the phone number or email on file. The code must be submitted to
        /auth/recover/verify to obtain a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRecoveryInput"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryChallenge"
        "404":
          description: No user found
        "429":
          description: Too many attempts
        "503":
          description: No code delivery provider is configured

  /auth/recover/verify:
    post:
      operationId: verifyRecovery
      tags: [auth]
      summary: Exchange a one-time code for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRecoveryInput"
      responses:
        "200":
          description: Recovered user and session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Code is wrong, expired or already used
        "429":
          description: Too many attempts

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current device session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in as a dispatcher
      description: Sets an HTTP-only session cookie on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed-in dispatcher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Wrong email or password
        "429":
          description: Too many attempts

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out the current dispatcher
      responses:
        "204":
          description: Signed out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: The signed-in dispatcher
      security:
        - adminCookie: []
      responses:
        "200":
          description: Signed-in dispatcher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not signed in

  /users/{userId}/push-token:
    patch:
      operationId: registerPushToken
      security:
        - bearerAuth: []
      tags: [users]
      summary: Register an Expo push token for a user
      description: Stores the device's Expo push notification token so the server can send alerts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenInput"
      responses:
        "204":
          description: Token stored
        "404":
          description: User not found

  /users/{userId}:
    get:
      operationId: getUser
      security:
        - bearerAuth: []
        - adminCookie: []
      tags: [users]
      summary: Get a user by id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      security:
        - adminCookie: []
      tags: [users]
      summary: List registered users (admin)
      responses:
        "200":
          description: All registered users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /alerts:
    post:
      operationId: createAlert
      security:
        - bearerAuth: []
      tags: [alerts]
      summary: Trigger an emergency alert
      description: Creates a distress alert with the user's precise location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertInput"
      responses:
        "200":
          description: The created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
    get:
      operationId: listAlerts
      security:
        - adminCookie: []
      tags: [alerts]
      summary: List all alerts (admin)
      responses:
        "200":
          description: All alerts with user details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertWithUser"

  /alerts/user/{userId}:
    get:
      operationId: listUserAlerts
      security:
        - bearerAuth: []
        - adminCookie: []
      tags: [alerts]
      summary: List alerts for a single user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alerts for this user, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{alertId}/resolve:
    patch:
      operationId: resolveAlert
      security:
        - adminCookie: []
      tags: [alerts]
      summary: Resolve an active alert
      description: Marks an active distress alert as resolved by a dispatcher
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resolved alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Alert not found

  /alerts/stats:
    get:
      operationId: getAlertStats
      security:
        - adminCookie: []
      tags: [alerts]
      summary: Aggregate alert statistics (admin)
      responses:
        "200":
          description: Counts and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertStats"

  /broadcasts:
    post:
      operationId: createBroadcast
      tags: [broadcasts]
      summary: Send a notification to every citizen
      description: >
        Stores the message (shown in every citizen's in-app inbox) and sends a
        push notification to each device that has registered a push token.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBroadcastInput"
      responses:
        "200":
          description: The broadcast with push delivery stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
    get:
      operationId: listBroadcasts
      tags: [broadcasts]
      summary: Past broadcasts, newest first (admin)
      security:
        - adminCookie: []
      responses:
        "200":
          description: Broadcast history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Broadcast"

  /broadcasts/reach:
    get:
      operationId: getBroadcastReach
      tags: [broadcasts]
      summary: How many citizens a broadcast would reach (admin)
      security:
        - adminCookie: []
      responses:
        "200":
          description: Audience size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastReach"

  /notifications:
    get:
      operationId: listNotifications
      tags: [broadcasts]
      summary: The signed-in citizen's notifications inbox, newest first
      description: Broadcasts sent since the citizen registered (latest 50)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenNotification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [broadcasts]
      summary: Mark every notification in the inbox as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All marked read

  /notifications/clear-read:
    post:
      operationId: clearReadNotifications
      tags: [broadcasts]
      summary: Remove all read notifications from the inbox
      security:
        - bearerAuth: []
      responses:
        "200":
          description: How many were cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearReadResult"

  /notifications/{notificationId}:
    get:
      operationId: getNotification
      tags: [broadcasts]
      summary: One notification from the inbox
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenNotification"
        "404":
          description: Not in this citizen's inbox (never received or cleared)

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [broadcasts]
      summary: Mark one notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Marked read
        "404":
          description: Not in this citizen's inbox

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Citizen device session token from register or recovery
    adminCookie:
      type: apiKey
      in: cookie
      name: sa_admin
      description: Dispatcher session cookie set by /admin/login

  schemas:
    CreateBroadcastInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 65
        body:
          type: string
          minLength: 1
          maxLength: 240
      required:
        - title
        - body

    Broadcast:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        sentByName:
          type: string
          nullable: true
          description: Dispatcher who sent it (null if their account was deleted)
        recipientCount:
          type: integer
          description: Devices a push was attempted to
        sentCount:
          type: integer
          description: Pushes accepted by the Expo push service
        failedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - body
        - sentByName
        - recipientCount
        - sentCount
        - failedCount
        - createdAt

    BroadcastReach:
      type: object
      properties:
        totalUsers:
          type: integer
          description: Citizens who will see it in their in-app inbox
        pushEnabledUsers:
          type: integer
          description: Citizens whose device will also get a push notification
      required:
        - totalUsers
        - pushEnabledUsers

    CitizenNotification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - body
        - read
        - createdAt

    ClearReadResult:
      type: object
      properties:
        cleared:
          type: integer
      required:
        - cleared

    AuthSession:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for this device. Store it securely.
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    StartRecoveryInput:
      type: object
      properties:
        phone:
          type: string
        nationalId:
          type: string

    RecoveryChallenge:
      type: object
      properties:
        challengeId:
          type: string
        channel:
          type: string
          enum: [sms, email, console]
          description: How the code was delivered ("console" only in development)
        destination:
          type: string
          description: Masked phone number or email the code was sent to
      required:
        - challengeId
        - channel
        - destination

    VerifyRecoveryInput:
      type: object
      properties:
        challengeId:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - challengeId
        - code

    AdminLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterPushTokenInput:
      type: object
      properties:
        pushToken:
          type: string
          description: Expo push token (ExponentPushToken[...])
      required:
        - pushToken

    RegisterUserInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phoneNumber:
          type: string
          minLength: 5
        nationalId:
          type: string
          minLength: 3
        email:
          type: string
          format: email
      required:
        - fullName
        - phoneNumber
        - nationalId
        - email

    User:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        nationalId:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - phoneNumber
        - nationalId
        - email
        - createdAt

    CreateAlertInput:
      type: object
      properties:
        userId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
          nullable: true
        triggerSource:
          type: string
          enum: [button, shake]
      required:
        - userId
        - latitude
        - longitude
        - triggerSource

    Alert:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
          nullable: true
        triggerSource:
          type: string
          enum: [button, shake]
        status:
          type: string
          enum: [active, resolved]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - latitude
        - longitude
        - triggerSource
        - status
        - createdAt

    AlertWithUser:
      allOf:
        - $ref: "#/components/schemas/Alert"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
          required:
            - user

    AlertStats:
      type: object
      properties:
        totalAlerts:
          type: integer
        activeAlerts:
          type: integer
        alertsLast24h:
          type: integer
        totalUsers:
          type: integer
      required:
        - totalAlerts
        - activeAlerts
        - alertsLast24h
        - totalUsers
